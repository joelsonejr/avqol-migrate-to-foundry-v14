name: Publish Release

# Pushing a version tag (e.g. 14.0.0) builds the module and creates the GitHub
# release with the two files Foundry needs: module.json and avqol.zip.
on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

env:
    PKG_NAME: avqol

jobs:
    release:
        name: Build and release
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 20.x
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "npm"
                  cache-dependency-path: package-lock.json

            - name: Check that the tag matches the module version
              run: |
                  MODULE_VERSION=$(node -p "require('./public/module.json').version")
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "$MODULE_VERSION" != "$GITHUB_REF_NAME" ] || [ "$PACKAGE_VERSION" != "$GITHUB_REF_NAME" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match module.json ($MODULE_VERSION) / package.json ($PACKAGE_VERSION). Run 'npm version $GITHUB_REF_NAME' before tagging."
                      exit 1
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Zip files
              working-directory: ./dist
              run: zip -r ./${{ env.PKG_NAME }}.zip ./*

            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      ./dist/${{ env.PKG_NAME }}.zip
                      ./dist/module.json
